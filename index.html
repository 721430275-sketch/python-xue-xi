<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#F4F6FA" />
  <title>大学计算机（2）Python 学习</title>
  <style>
    :root {
      --bg: #F4F6FA;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --blue: #00468C;
      --blue-soft: #EFF6FF;
      --shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 48px 20px 64px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .sub {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 0.95rem;
    }
    .grid {
      display: grid;
      gap: 16px;
    }
    a.card {
      display: block;
      background: var(--card);
      border-radius: 16px;
      padding: 22px 22px 20px;
      text-decoration: none;
      color: inherit;
      box-shadow: var(--shadow);
      border: 1px solid rgba(148, 163, 184, 0.2);
    }
    a.card:active { transform: scale(0.99); }
    .label {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--blue);
      background: var(--blue-soft);
      border-radius: 999px;
      padding: 3px 10px;
      margin-bottom: 10px;
    }
    .card h2 {
      margin: 0 0 8px;
      font-size: 1.15rem;
    }
    .card p {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
      font-size: 0.92rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>大学计算机（2）Python 学习</h1>
    <p class="sub">选择下面一个页面开始。</p>
    <div class="grid">
      <a class="card" href="shuati.html">
        <span class="label">刷题</span>
        <h2>Python 知识点刷题网站</h2>
        <p>按知识点练习题目，查看成绩和进度。</p>
      </a>
      <a class="card" href="xuexi-ka.html">
        <span class="label">学习卡</span>
        <h2>Python 知识点互动翻页学习卡</h2>
        <p>用翻页卡片复习知识点。</p>
      </a>
    </div>
  </main>
</body>
</html>
