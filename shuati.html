<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大学计算机（2）Python 知识点刷题网站</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body {
    font-family: "Inter", "Noto Sans SC", -apple-system, BlinkMacSystemFont, sans-serif;
    background-color: #F4F6FA;
    color: #0F172A;
  }
  .font-mono-code {
    font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .opt-btn {
    transition: all 0.15s ease;
  }
  .opt-btn:hover:not(:disabled) {
    border-color: #3B82F6;
    background-color: #EFF6FF;
  }
  .fade-in {
    animation: fadeIn 0.2s ease-out;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body class="min-h-screen flex flex-col">

<!-- Top Navigation Bar -->
<header class="sticky top-0 z-30 bg-white/90 backdrop-blur border-b border-slate-200">
  <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-3">
    <button id="brandHomeBtn" type="button" class="flex items-center gap-2.5 text-left group">
      <span class="w-9 h-9 rounded-xl bg-blue-600 text-white flex items-center justify-center font-bold text-sm shadow-sm group-hover:bg-blue-700 transition">Py</span>
      <div>
        <div class="font-bold text-slate-900 text-sm sm:text-base leading-tight">Python 知识点刷题库</div>
        <div class="text-xs text-slate-500 hidden sm:block">大学计算机（2）· 6 章 22 考点 · 550 题全解析</div>
      </div>
    </button>

    <div class="flex items-center gap-2 sm:gap-3">
      <button id="navWrongBtn" type="button" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs sm:text-sm font-medium bg-rose-50 text-rose-700 hover:bg-rose-100 border border-rose-200 transition">
        <span>错题本</span>
        <span id="navWrongCount" class="px-1.5 py-0.5 rounded-md bg-rose-600 text-white text-xs font-semibold">0</span>
      </button>
      <button id="navFavBtn" type="button" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs sm:text-sm font-medium bg-amber-50 text-amber-800 hover:bg-amber-100 border border-amber-200 transition">
        <span>收藏夹</span>
        <span id="navFavCount" class="px-1.5 py-0.5 rounded-md bg-amber-500 text-white text-xs font-semibold">0</span>
      </button>
      <button id="resetProgressBtn" type="button" class="px-2.5 py-1.5 rounded-lg text-xs font-medium text-slate-500 hover:text-slate-800 hover:bg-slate-100 transition" title="重置刷题记录">
        重置
      </button>
    </div>
  </div>
</header>

<!-- Main Container -->
<main class="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 py-6 sm:py-8">

  <!-- ==================== VIEW 1: HOME / KP SELECTOR ==================== -->
  <section id="homeView" class="space-y-6 fade-in">

    <!-- Stats & Quick Actions Banner -->
    <div class="bg-white rounded-2xl border border-slate-200 p-5 sm:p-6 shadow-sm">
      <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-5">
        <div>
          <h1 class="text-xl sm:text-2xl font-bold text-slate-900">选择要刷的知识点</h1>
          <p class="text-sm text-slate-600 mt-1">所有考点编号（1.1–6.2）与《知识点精讲》完全同步，做完立刻看详细解析。</p>
        </div>
        <div class="grid grid-cols-3 gap-3 sm:gap-4 shrink-0">
          <div class="bg-slate-50 rounded-xl px-4 py-2.5 border border-slate-200/80 text-center">
            <div id="statDone" class="text-lg sm:text-xl font-bold text-blue-600">0</div>
            <div class="text-xs text-slate-500">已刷题数</div>
          </div>
          <div class="bg-slate-50 rounded-xl px-4 py-2.5 border border-slate-200/80 text-center">
            <div id="statAcc" class="text-lg sm:text-xl font-bold text-emerald-600">0%</div>
            <div class="text-xs text-slate-500">总正确率</div>
          </div>
          <div class="bg-slate-50 rounded-xl px-4 py-2.5 border border-slate-200/80 text-center">
            <div id="statTotal" class="text-lg sm:text-xl font-bold text-slate-800">550</div>
            <div class="text-xs text-slate-500">当前题库</div>
          </div>
        </div>
      </div>

      <!-- Controls Bar -->
      <div class="mt-5 pt-5 border-t border-slate-100 flex flex-wrap items-center justify-between gap-3">
        <div class="flex flex-wrap items-center gap-2">
          <!-- Syllabus Filter -->
          <div class="inline-flex rounded-xl bg-slate-100 p-1 text-xs sm:text-sm" role="group" aria-label="超纲筛选">
            <button type="button" data-filter="core" class="filter-pill px-3 py-1.5 rounded-lg font-medium transition">仅大纲核心 (521)</button>
            <button type="button" data-filter="all" class="filter-pill px-3 py-1.5 rounded-lg font-medium transition">全部 (550)</button>
            <button type="button" data-filter="oos" class="filter-pill px-3 py-1.5 rounded-lg font-medium transition">仅超纲 (29)</button>
          </div>

          <!-- Practice Mode -->
          <div class="inline-flex rounded-xl bg-slate-100 p-1 text-xs sm:text-sm" role="group" aria-label="刷题模式">
            <button type="button" data-mode="practice" class="mode-pill px-3 py-1.5 rounded-lg font-medium transition">逐题解析</button>
            <button type="button" data-mode="exam" class="mode-pill px-3 py-1.5 rounded-lg font-medium transition">模拟交卷</button>
          </div>

          <!-- Order Toggle -->
          <label class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-slate-100 text-xs sm:text-sm text-slate-700 cursor-pointer select-none">
            <input id="shuffleToggle" type="checkbox" class="rounded text-blue-600 focus:ring-blue-500">
            <span>随机打乱</span>
          </label>
        </div>

        <div class="flex flex-wrap items-center gap-2">
          <input id="searchInput" type="search" placeholder="搜索题目关键词..." class="px-3 py-1.5 rounded-xl border border-slate-200 text-sm w-44 sm:w-52 focus:outline-none focus:ring-2 focus:ring-blue-500">
          <button id="mock20Btn" type="button" class="px-3.5 py-1.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-xs sm:text-sm font-medium shadow-sm transition">
            随机抽 20 题模拟考
          </button>
        </div>
      </div>
    </div>

    <!-- Search Results Box (hidden unless searching) -->
    <div id="searchResultBox" class="hidden bg-white rounded-2xl border border-blue-200 p-5 shadow-sm">
      <div class="flex items-center justify-between mb-3">
        <h2 id="searchResultTitle" class="font-bold text-slate-900">搜索结果</h2>
        <button id="startSearchQuizBtn" type="button" class="px-3 py-1.5 rounded-lg bg-blue-600 text-white text-xs font-medium hover:bg-blue-700 transition">刷这些匹配题</button>
      </div>
      <div id="searchPreviewList" class="space-y-2 text-sm text-slate-700 max-h-60 overflow-y-auto"></div>
    </div>

    <!-- Chapters & 22 Knowledge Points Grid -->
    <div id="chaptersContainer" class="space-y-6"></div>
  </section>

  <!-- ==================== VIEW 2: QUIZ INTERFACE ==================== -->
  <section id="quizView" class="hidden max-w-3xl mx-auto space-y-5 fade-in">
    <!-- Quiz Header -->
    <div class="flex flex-wrap items-center justify-between gap-3">
      <button id="backHomeBtn" type="button" class="inline-flex items-center gap-1.5 text-sm font-medium text-slate-600 hover:text-blue-600 transition">
        <span>← 返回知识点列表</span>
      </button>
      <div class="flex items-center gap-2">
        <span id="quizModeBadge" class="px-2.5 py-1 rounded-lg text-xs font-medium bg-blue-50 text-blue-700 border border-blue-200">逐题解析模式</span>
        <button id="toggleSheetBtn" type="button" class="px-3 py-1 rounded-lg text-xs font-medium bg-white border border-slate-200 text-slate-700 hover:bg-slate-50 transition">
          答题卡
        </button>
      </div>
    </div>

    <!-- Title & Progress -->
    <div class="bg-white rounded-2xl border border-slate-200 p-4 sm:p-5 shadow-sm">
      <div class="flex items-center justify-between gap-3 mb-2.5">
        <h2 id="quizTitle" class="font-bold text-slate-900 text-base sm:text-lg truncate">知识点</h2>
        <span id="quizProgressText" class="text-sm font-mono-code font-semibold text-blue-600 shrink-0">1 / 20</span>
      </div>
      <div class="w-full h-2 bg-slate-100 rounded-full overflow-hidden">
        <div id="quizProgressBar" class="h-full bg-blue-600 rounded-full transition-all duration-300" style="width: 5%"></div>
      </div>

      <!-- Collapsible Question Sheet -->
      <div id="questionSheet" class="hidden mt-4 pt-4 border-t border-slate-100">
        <div class="text-xs text-slate-500 mb-2">点击题号快速跳转（绿=答对，红=答错，蓝=已选，灰=未答）：</div>
        <div id="sheetGrid" class="grid grid-cols-8 sm:grid-cols-12 gap-1.5"></div>
      </div>
    </div>

    <!-- Active Question Card -->
    <div class="bg-white rounded-2xl border border-slate-200 p-5 sm:p-7 shadow-sm space-y-5">
      <div class="flex flex-wrap items-center justify-between gap-2">
        <div class="flex flex-wrap items-center gap-2">
          <span id="qKpTag" class="px-2.5 py-0.5 rounded-md text-xs font-medium bg-slate-100 text-slate-700">1.1</span>
          <span id="qIdTag" class="text-xs font-mono-code text-slate-400">#1</span>
          <span id="qOosTag" class="hidden px-2.5 py-0.5 rounded-md text-xs font-semibold bg-amber-100 text-amber-800">原文档黄标超纲</span>
        </div>
        <button id="favToggleBtn" type="button" class="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg text-xs font-medium border border-slate-200 text-slate-600 hover:bg-amber-50 hover:text-amber-700 transition">
          <span id="favStar">☆</span>
          <span id="favLabel">收藏</span>
        </button>
      </div>

      <!-- Question Stem -->
      <div id="qStem" class="text-base sm:text-lg font-medium text-slate-900 leading-relaxed whitespace-pre-wrap"></div>

      <!-- Options A/B/C/D -->
      <div id="qOptions" class="space-y-3"></div>

      <!-- Explanation Box -->
      <div id="expBox" class="hidden rounded-xl border p-4 sm:p-5 space-y-2 fade-in">
        <div class="flex items-center justify-between">
          <div id="expStatus" class="font-bold text-sm"></div>
          <span id="expAnswer" class="font-mono-code text-xs font-semibold px-2 py-0.5 rounded bg-white/80"></span>
        </div>
        <p id="expText" class="text-sm text-slate-700 leading-relaxed"></p>
      </div>

      <!-- Action Footer -->
      <div class="pt-3 border-t border-slate-100 flex flex-wrap items-center justify-between gap-3">
        <button id="prevBtn" type="button" class="px-4 py-2 rounded-xl border border-slate-200 text-sm font-medium text-slate-700 hover:bg-slate-50 disabled:opacity-40 transition">
          上一题
        </button>

        <div class="flex items-center gap-2">
          <button id="peekExpBtn" type="button" class="px-3.5 py-2 rounded-xl border border-slate-200 text-xs sm:text-sm font-medium text-slate-600 hover:bg-slate-50 transition">
            查看解析
          </button>
          <button id="nextBtn" type="button" class="px-5 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium shadow-sm transition">
            下一题
          </button>
          <button id="submitExamBtn" type="button" class="hidden px-5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium shadow-sm transition">
            交卷看成绩
          </button>
        </div>
      </div>
    </div>

    <div class="text-center text-xs text-slate-400">
      快捷键：按 <kbd class="px-1.5 py-0.5 bg-white border border-slate-200 rounded">A</kbd>-<kbd class="px-1.5 py-0.5 bg-white border border-slate-200 rounded">D</kbd> 选答案，按 <kbd class="px-1.5 py-0.5 bg-white border border-slate-200 rounded">←</kbd> <kbd class="px-1.5 py-0.5 bg-white border border-slate-200 rounded">→</kbd> 切换题目
    </div>
  </section>

  <!-- ==================== VIEW 3: RESULT SUMMARY ==================== -->
  <section id="resultView" class="hidden max-w-2xl mx-auto bg-white rounded-2xl border border-slate-200 p-6 sm:p-8 shadow-sm space-y-6 fade-in">
    <div class="text-center space-y-2">
      <div id="resultBadge" class="inline-block px-3 py-1 rounded-full text-xs font-semibold bg-blue-50 text-blue-700">本轮练习完成</div>
      <h2 id="resultTitle" class="text-2xl font-bold text-slate-900">成绩汇总</h2>
      <div class="flex items-baseline justify-center gap-1 pt-2">
        <span id="resultScore" class="text-5xl font-bold text-blue-600 font-mono-code">0%</span>
      </div>
      <p id="resultSub" class="text-sm text-slate-600"></p>
    </div>

    <div id="resultWrongList" class="space-y-3 max-h-96 overflow-y-auto border-t border-b border-slate-100 py-4"></div>

    <div class="flex flex-wrap items-center justify-center gap-3">
      <button id="retryWrongBtn" type="button" class="px-5 py-2.5 rounded-xl bg-rose-600 hover:bg-rose-700 text-white text-sm font-medium shadow-sm transition">
        只重刷本轮错题
      </button>
      <button id="retryAllBtn" type="button" class="px-5 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium shadow-sm transition">
        再刷一遍本组
      </button>
      <button id="resultHomeBtn" type="button" class="px-5 py-2.5 rounded-xl border border-slate-200 text-slate-700 hover:bg-slate-50 text-sm font-medium transition">
        返回知识点大厅
      </button>
    </div>
  </section>

</main>

<!-- In-page Toast -->
<div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 hidden px-4 py-2.5 rounded-xl bg-slate-900 text-white text-sm shadow-lg"></div>

<!-- In-page Reset Confirm Modal -->
<div id="resetModal" class="fixed inset-0 z-50 hidden bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-xl space-y-4">
    <h3 class="text-lg font-bold text-slate-900">重置所有刷题进度？</h3>
    <p class="text-sm text-slate-600">这会清空已刷记录、正确率统计、错题本和收藏夹，方便重新开始一轮复习。</p>
    <div class="flex justify-end gap-2 pt-2">
      <button id="cancelResetBtn" type="button" class="px-4 py-2 rounded-xl border border-slate-200 text-sm font-medium text-slate-700 hover:bg-slate-50">取消</button>
      <button id="confirmResetBtn" type="button" class="px-4 py-2 rounded-xl bg-rose-600 text-white text-sm font-medium hover:bg-rose-700">确认重置</button>
    </div>
  </div>
</div>

const STORAGE_KEY = 'py_quiz_progress_v1';

// Persistent state
let store = {
  answered: {},   // { [qId]: { selected: 'A', correct: true } }
  wrong: [],      // [qId, ...]
  favs: [],       // [qId, ...]
  filter: 'core', // 'core' | 'all' | 'oos'
  mode: 'practice', // 'practice' | 'exam'
  shuffle: false
};

function loadStore() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      store = { ...store, ...parsed };
    }
  } catch (e) { /* sandbox storage fallback */ }
}

function saveStore() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(store));
  } catch (e) { /* ignore */ }
}

// Active quiz session state

  title: '',
  questions: [],
  idx: 0,
  answers: {}, // { [qId]: 'A' }
  peeked: {},  // { [qId]: true }
  submitted: false,
  mode: 'practice'
};

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.remove('hidden');
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(() => t.classList.add('hidden'), 2400);
}

function getFilteredQuestions(list) {
  if (store.filter === 'core') return list.filter(q => !q.oos);
  if (store.filter === 'oos') return list.filter(q => q.oos);
  return list;
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

// Format stem: highlight multi-line code cleanly
function renderStemHtml(stem) {
  const lines = stem.split('\n');
  if (lines.length <= 1) {
    return escapeHtml(stem);
  }
  const codePattern = /(>>>|def |for |while |if |elif |else:|print\(|return |import |from |turtle\.|=[ \[\('"{0-9]|range\()/;
  let html = '';
  let codeBuf = [];
  const flushCode = () => {
    if (codeBuf.length > 0) {
      html += `<pre class="font-mono-code text-sm bg-slate-900 text-slate-100 rounded-xl p-4 my-3 overflow-x-auto leading-relaxed">${escapeHtml(codeBuf.join('\n'))}</pre>`;
      codeBuf = [];
    }
  };
  lines.forEach((ln, i) => {
    const trimmed = ln.trim();
    if (i > 0 && (codePattern.test(trimmed) || (codeBuf.length > 0 && !trimmed.startsWith('程序') && !trimmed.startsWith('运行结果') && !trimmed.startsWith('上述') && !trimmed.startsWith('当输入') && !trimmed.startsWith('在提示') && !trimmed.startsWith('从键盘')))) {
      codeBuf.push(ln);
    } else {
      flushCode();
      html += `<div class="mb-1">${escapeHtml(ln)}</div>`;
    }
  });
  flushCode();
  return html;
}

      const kpQs = getFilteredQuestions(DB.questions.filter(q => q.kp === kp.id));
      if (kpQs.length === 0) return;
      const kpDone = kpQs.filter(q => store.answered[q.id]).length;
      const kpRight = kpQs.filter(q => store.answered[q.id] && store.answered[q.id].correct).length;
      const kpOos = kpQs.filter(q => q.oos).length;
      const pct = Math.round((kpDone / kpQs.length) * 100);

      const card = document.createElement('button');
      card.type = 'button';
      card.className = 'text-left rounded-xl border border-slate-200 hover:border-blue-400 hover:shadow-md bg-slate-50/60 hover:bg-white p-4 transition flex flex-col justify-between gap-3 group';
      card.innerHTML = `
        <div>
          <div class="flex items-center justify-between gap-2 mb-1.5">
            <span class="font-mono-code text-xs font-bold px-2 py-0.5 rounded-md bg-blue-100 text-blue-800">${kp.id}</span>
            <div class="flex items-center gap-1.5">
              ${kpOos > 0 ? `<span class="text-[11px] font-medium px-1.5 py-0.5 rounded bg-amber-100 text-amber-800">含超纲 ${kpOos}</span>` : ''}
              <span class="text-xs font-mono-code text-slate-500">${kpQs.length} 题</span>
            </div>
          </div>
          <div class="font-semibold text-slate-900 text-sm sm:text-base group-hover:text-blue-700 transition">${escapeHtml(kp.title)}</div>
        </div>
        <div class="space-y-1.5">
          <div class="flex items-center justify-between text-xs text-slate-500">
            <span>进度 ${kpDone}/${kpQs.length}</span>
            <span>${kpDone ? '正确率 ' + Math.round((kpRight / kpDone) * 100) + '%' : '未开始'}</span>
          </div>
          <div class="w-full h-1.5 bg-slate-200 rounded-full overflow-hidden">
            <div class="h-full bg-blue-600 rounded-full transition-all" style="width:${pct}%"></div>
          </div>
        </div>
      `;
      card.addEventListener('click', () => startQuiz(`${kp.id} ${kp.title}`, kpQs));
      grid.appendChild(card);
    });

    sec.querySelector('.start-ch-btn').addEventListener('click', () => {
      startQuiz(ch.title, chQs);
    });

    container.appendChild(sec);
  });
}

// ==================== QUIZ ENGINE ====================
function startQuiz(title, qList) {
  if (!qList || qList.length === 0) {
    showToast('当前筛选条件下没有题目哦，可切换“全部题目”试试');
    return;
  }
  let list = [...qList];
  if (store.shuffle) {
    for (let i = list.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [list[i], list[j]] = [list[j], list[i]];
    }
  }
  session = {
    title,
    questions: list,
    idx: 0,
    answers: {},
    peeked: {},
    submitted: false,
    mode: store.mode
  };
  document.getElementById('homeView').classList.add('hidden');
  document.getElementById('resultView').classList.add('hidden');
  document.getElementById('quizView').classList.remove('hidden');
  document.getElementById('questionSheet').classList.add('hidden');
  renderQuestion();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderQuestion() {
  const q = session.questions[session.idx];
  const total = session.questions.length;
  const userChoice = session.answers[q.id];
  const isRevealed = (session.mode === 'practice' && !!userChoice) || session.submitted || !!session.peeked[q.id];

  document.getElementById('quizTitle').textContent = session.title;
  document.getElementById('quizProgressText').textContent = `${session.idx + 1} / ${total}`;
  document.getElementById('quizProgressBar').style.width = `${Math.round(((session.idx + 1) / total) * 100)}%`;
  document.getElementById('quizModeBadge').textContent = session.mode === 'practice' ? '逐题解析模式' : (session.submitted ? '已交卷复盘' : '模拟交卷模式');

  const kp = kpMap[q.kp];
  document.getElementById('qKpTag').textContent = kp ? `${kp.id} ${kp.title}` : q.kp;
  document.getElementById('qIdTag').textContent = `题号 #${q.id}`;
  document.getElementById('qOosTag').classList.toggle('hidden', !q.oos);

  // Favorite button
  const isFav = store.favs.includes(q.id);
  document.getElementById('favStar').textContent = isFav ? '★' : '☆';
  document.getElementById('favLabel').textContent = isFav ? '已收藏' : '收藏';
  document.getElementById('favToggleBtn').className =
    'inline-flex items-center gap-1 px-2.5 py-1 rounded-lg text-xs font-medium border transition ' +
    (isFav ? 'border-amber-300 bg-amber-50 text-amber-700' : 'border-slate-200 text-slate-600 hover:bg-amber-50 hover:text-amber-700');

  // Stem
  document.getElementById('qStem').innerHTML = renderStemHtml(q.stem);

  // Options
  const optBox = document.getElementById('qOptions');
  optBox.innerHTML = '';
  ['A', 'B', 'C', 'D'].forEach(letter => {
    const val = q.opts[letter] || '';
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.disabled = (session.mode === 'practice' && !!userChoice) || session.submitted;

    let cls = 'opt-btn w-full text-left px-4 py-3.5 rounded-xl border-2 flex items-start gap-3 ';
    let badgeCls = 'w-7 h-7 rounded-lg flex items-center justify-center font-mono-code font-bold text-sm shrink-0 ';

    if (isRevealed) {
      if (letter === q.ans) {
        cls += 'border-emerald-500 bg-emerald-50/90 text-emerald-950';
        badgeCls += 'bg-emerald-600 text-white';
      } else if (letter === userChoice && userChoice !== q.ans) {
        cls += 'border-rose-500 bg-rose-50/90 text-rose-950';
        badgeCls += 'bg-rose-600 text-white';
      } else {
        cls += 'border-slate-200 bg-white text-slate-500 opacity-75';
        badgeCls += 'bg-slate-100 text-slate-500';
      }
    } else if (letter === userChoice) {
      cls += 'border-blue-600 bg-blue-50 text-blue-950';
      badgeCls += 'bg-blue-600 text-white';
    } else {
      cls += 'border-slate-200 bg-white text-slate-800';
      badgeCls += 'bg-slate-100 text-slate-700';
    }

    btn.className = cls;
    btn.innerHTML = `
      <span class="${badgeCls}">${letter}</span>
      <span class="pt-0.5 text-sm sm:text-base leading-relaxed whitespace-pre-wrap break-words">${escapeHtml(val)}</span>
    `;
    btn.addEventListener('click', () => handleSelectOption(letter));
    optBox.appendChild(btn);
  });

  // Explanation box
  const expBox = document.getElementById('expBox');
  if (isRevealed) {
    expBox.classList.remove('hidden');
    const isCorrect = userChoice === q.ans;
    if (!userChoice) {
      expBox.className = 'rounded-xl border border-blue-200 bg-blue-50/70 p-4 sm:p-5 space-y-2 fade-in';
      document.getElementById('expStatus').textContent = '参考解析';
      document.getElementById('expStatus').className = 'font-bold text-sm text-blue-800';
    } else if (isCorrect) {
      expBox.className = 'rounded-xl border border-emerald-200 bg-emerald-50/70 p-4 sm:p-5 space-y-2 fade-in';
      document.getElementById('expStatus').textContent = '✓ 回答正确！';
      document.getElementById('expStatus').className = 'font-bold text-sm text-emerald-800';
    } else {
      expBox.className = 'rounded-xl border border-rose-200 bg-rose-50/70 p-4 sm:p-5 space-y-2 fade-in';
      document.getElementById('expStatus').textContent = `✗ 回答有误（你选了 ${userChoice}）· 已加入错题本`;
      document.getElementById('expStatus').className = 'font-bold text-sm text-rose-800';
    }
    document.getElementById('expAnswer').textContent = `正确答案：${q.ans}`;
    document.getElementById('expText').textContent = q.exp;
  } else {
    expBox.classList.add('hidden');
  }

  // Footer buttons
  document.getElementById('prevBtn').disabled = session.idx === 0;
  const isLast = session.idx === total - 1;
  const nextBtn = document.getElementById('nextBtn');
  const submitBtn = document.getElementById('submitExamBtn');
  const peekBtn = document.getElementById('peekExpBtn');

  peekBtn.classList.toggle('hidden', isRevealed || session.mode === 'exam');

  if (session.mode === 'exam' && !session.submitted) {
    nextBtn.classList.toggle('hidden', isLast);
    submitBtn.classList.remove('hidden');
    submitBtn.textContent = isLast ? '交卷看成绩' : `交卷 (${Object.keys(session.answers).length}/${total})`;
  } else {
    submitBtn.classList.add('hidden');
    nextBtn.classList.remove('hidden');
    nextBtn.textContent = isLast ? '查看本轮成绩' : '下一题';
  }

  renderSheet();
}

function handleSelectOption(letter) {
  const q = session.questions[session.idx];
  session.answers[q.id] = letter;

  if (session.mode === 'practice') {
    recordAnswerToStore(q, letter);
  }
  renderQuestion();
}

function recordAnswerToStore(q, letter) {
  const isCorrect = letter === q.ans;
  store.answered[q.id] = { selected: letter, correct: isCorrect };
  if (!isCorrect) {
    if (!store.wrong.includes(q.id)) store.wrong.push(q.id);
  } else {
    // If answered correctly, remove from wrong book automatically!
    store.wrong = store.wrong.filter(id => id !== q.id);
  }
  saveStore();
  document.getElementById('navWrongCount').textContent = store.wrong.length;
}

function renderSheet() {
  const grid = document.getElementById('sheetGrid');
  grid.innerHTML = '';
  session.questions.forEach((q, i) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    const ans = session.answers[q.id];
    const showGrade = (session.mode === 'practice' && ans) || session.submitted;
    let cls = 'h-8 rounded-lg text-xs font-mono-code font-semibold border transition ';
    if (i === session.idx) cls += 'ring-2 ring-blue-500 ring-offset-1 ';
    if (showGrade) {
      if (!ans) cls += 'bg-slate-100 text-slate-400 border-slate-200';
      else if (ans === q.ans) cls += 'bg-emerald-100 text-emerald-800 border-emerald-300';
      else cls += 'bg-rose-100 text-rose-800 border-rose-300';
    } else if (ans) {
      cls += 'bg-blue-100 text-blue-800 border-blue-300';
    } else {
      cls += 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50';
    }
    btn.className = cls;
    btn.textContent = i + 1;
    btn.addEventListener('click', () => {
      session.idx = i;
      renderQuestion();
    });
    grid.appendChild(btn);
  });
}

function finishSession() {
  if (session.mode === 'exam' && !session.submitted) {
    session.submitted = true;
    session.questions.forEach(q => {
      const choice = session.answers[q.id];
      if (choice) recordAnswerToStore(q, choice);
    });
  }
  const total = session.questions.length;
  let right = 0;
  const wrongQs = [];
  session.questions.forEach(q => {
    if (session.answers[q.id] === q.ans) right++;
    else wrongQs.push(q);
  });
  const pct = total ? Math.round((right / total) * 100) : 0;

  document.getElementById('quizView').classList.add('hidden');
  document.getElementById('resultView').classList.remove('hidden');
  document.getElementById('resultTitle').textContent = session.title;
  document.getElementById('resultScore').textContent = pct + '%';
  document.getElementById('resultSub').textContent = `共 ${total} 题，答对 ${right} 题，错/未答 ${wrongQs.length} 题`;

  const retryWrongBtn = document.getElementById('retryWrongBtn');
  retryWrongBtn.classList.toggle('hidden', wrongQs.length === 0);

  const wrongList = document.getElementById('resultWrongList');
  if (wrongQs.length === 0) {
    wrongList.innerHTML = `<div class="text-center py-6 text-emerald-700 font-semibold">全对通关！这一组知识点已经稳稳拿下了。</div>`;
  } else {
    wrongList.innerHTML = `<div class="text-xs font-semibold text-slate-500 mb-2">错题与未答题解析速览（${wrongQs.length} 题）：</div>` +
      wrongQs.map(q => `
        <div class="rounded-xl bg-slate-50 border border-slate-200 p-3.5 space-y-1.5 text-sm">
          <div class="font-medium text-slate-900">${escapeHtml(q.stem.split('\n')[0].slice(0, 90))}${q.stem.length > 90 ? '...' : ''}</div>
          <div class="text-xs flex flex-wrap gap-2">
            <span class="text-rose-700 font-semibold">你的答案：${session.answers[q.id] || '未作答'}</span>
            <span class="text-emerald-700 font-semibold">正确答案：${q.ans}（${escapeHtml(q.opts[q.ans] || '')}）</span>
          </div>
          <div class="text-xs text-slate-600 leading-relaxed">${escapeHtml(q.exp)}</div>
        </div>
      `).join('');
  }
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ==================== EVENT LISTENERS ====================
document.getElementById('brandHomeBtn').addEventListener('click', renderHome);
document.getElementById('backHomeBtn').addEventListener('click', renderHome);
document.getElementById('resultHomeBtn').addEventListener('click', renderHome);

document.querySelectorAll('.filter-pill').forEach(btn => {
  btn.addEventListener('click', () => {
    store.filter = btn.dataset.filter;
    saveStore();
    renderHome();
  });
});

document.querySelectorAll('.mode-pill').forEach(btn => {
  btn.addEventListener('click', () => {
    store.mode = btn.dataset.mode;
    saveStore();
    renderHome();
  });
});

document.getElementById('shuffleToggle').addEventListener('change', e => {
  store.shuffle = e.target.checked;
  saveStore();
});

document.getElementById('mock20Btn').addEventListener('click', () => {
  const pool = [...getFilteredQuestions(DB.questions)];
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  startQuiz('全库随机 20 题模拟考', pool.slice(0, 20));
});

document.getElementById('navWrongBtn').addEventListener('click', () => {
  const list = DB.questions.filter(q => store.wrong.includes(q.id));
  if (list.length === 0) {
    showToast('错题本目前是空的，太棒啦！');
    return;
  }
  startQuiz(`错题本专项重刷（${list.length} 题）`, list);
});

document.getElementById('navFavBtn').addEventListener('click', () => {
  const list = DB.questions.filter(q => store.favs.includes(q.id));
  if (list.length === 0) {
    showToast('还没有收藏题目，刷题时点击右上角 ☆ 即可收藏');
    return;
  }
  startQuiz(`收藏夹专项复习（${list.length} 题）`, list);
});

// Search
let lastSearchMatches = [];
document.getElementById('searchInput').addEventListener('input', e => {
  const kw = e.target.value.trim().toLowerCase();
  const box = document.getElementById('searchResultBox');
  if (!kw) {
    box.classList.add('hidden');
    return;
  }
  lastSearchMatches = getFilteredQuestions(DB.questions).filter(q =>
    q.stem.toLowerCase().includes(kw) ||
    q.exp.toLowerCase().includes(kw) ||
    Object.values(q.opts).some(v => v.toLowerCase().includes(kw))
  );
  box.classList.remove('hidden');
  document.getElementById('searchResultTitle').textContent = `找到 ${lastSearchMatches.length} 道包含“${e.target.value.trim()}”的题目`;
  const preview = document.getElementById('searchPreviewList');
  if (lastSearchMatches.length === 0) {
    preview.innerHTML = '<div class="text-slate-500 py-2">没有匹配题目，换个关键词试试。</div>';
  } else {
    preview.innerHTML = lastSearchMatches.slice(0, 15).map(q => `
      <div class="p-2.5 rounded-lg bg-slate-50 hover:bg-blue-50 cursor-pointer flex items-center justify-between gap-2" data-jump-q="${q.id}">
        <span class="truncate">${escapeHtml(q.stem.replace(/\n/g, ' '))}</span>
        <span class="text-xs font-mono-code text-blue-700 shrink-0">${q.kp}</span>
      </div>
    `).join('');
    preview.querySelectorAll('[data-jump-q]').forEach(el => {
      el.addEventListener('click', () => {
        const qid = Number(el.dataset.jumpQ);
        const target = lastSearchMatches.find(x => x.id === qid);
        if (target) startQuiz(`搜索结果：${e.target.value.trim()}`, [target]);
      });
    });
  }
});

document.getElementById('startSearchQuizBtn').addEventListener('click', () => {
  const kw = document.getElementById('searchInput').value.trim();
  startQuiz(`关键词专项：${kw}`, lastSearchMatches);
});

// Quiz controls
document.getElementById('prevBtn').addEventListener('click', () => {
  if (session.idx > 0) {
    session.idx--;
    renderQuestion();
  }
});

document.getElementById('nextBtn').addEventListener('click', () => {
  if (session.idx < session.questions.length - 1) {
    session.idx++;
    renderQuestion();
  } else {
    finishSession();
  }
});

document.getElementById('submitExamBtn').addEventListener('click', finishSession);

document.getElementById('peekExpBtn').addEventListener('click', () => {
  const q = session.questions[session.idx];
  session.peeked[q.id] = true;
  renderQuestion();
});

document.getElementById('toggleSheetBtn').addEventListener('click', () => {
  document.getElementById('questionSheet').classList.toggle('hidden');
});

document.getElementById('favToggleBtn').addEventListener('click', () => {
  const q = session.questions[session.idx];
  if (store.favs.includes(q.id)) {
    store.favs = store.favs.filter(id => id !== q.id);
    showToast('已取消收藏');
  } else {
    store.favs.push(q.id);
    showToast('已加入收藏夹');
  }
  saveStore();
  document.getElementById('navFavCount').textContent = store.favs.length;
  renderQuestion();
});

document.getElementById('retryWrongBtn').addEventListener('click', () => {
  const wrongQs = session.questions.filter(q => session.answers[q.id] !== q.ans);
  startQuiz(session.title + ' · 错题重刷', wrongQs);
});

document.getElementById('retryAllBtn').addEventListener('click', () => {
  startQuiz(session.title, session.questions);
});

// Reset modal
document.getElementById('resetProgressBtn').addEventListener('click', () => {
  document.getElementById('resetModal').classList.remove('hidden');
});
document.getElementById('cancelResetBtn').addEventListener('click', () => {
  document.getElementById('resetModal').classList.add('hidden');
});
document.getElementById('confirmResetBtn').addEventListener('click', () => {
  store.answered = {};
  store.wrong = [];
  store.favs = [];
  saveStore();
  document.getElementById('resetModal').classList.add('hidden');
  showToast('刷题进度已重置');
  renderHome();
});

// Keyboard shortcuts in quiz view
document.addEventListener('keydown', e => {
  if (document.getElementById('quizView').classList.contains('hidden')) return;
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  const key = e.key.toUpperCase();
  if (['A', 'B', 'C', 'D'].includes(key)) {
    const q = session.questions[session.idx];
    const locked = (session.mode === 'practice' && !!session.answers[q.id]) || session.submitted;
    if (!locked) handleSelectOption(key);
  } else if (e.key === 'ArrowLeft' && session.idx > 0) {
    session.idx--;
    renderQuestion();
  } else if (e.key === 'ArrowRight') {
    if (session.idx < session.questions.length - 1) {
      session.idx++;
      renderQuestion();
    }
  }
});

// Init
loadStore();
renderHome();
</script>
